name: nazraa

services:
  mysql:
    # Match the authoritative Hostinger source engine during migration.
    image: mariadb:11.8.9
    restart: unless-stopped
    env_file: ./config/mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --slow-query-log=ON
      - --long-query-time=0.5
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-8G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-150}
    volumes:
      - ./mariadb/data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "allkeys-lru"]
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    image: nazraa-api:production-candidate
    build:
      # The authoritative checked-out source on the production VPS. Never
      # rebuild from the older pre-cutover /opt/nazraa/app snapshot.
      context: ./app-next
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file: ./config/app.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_SSL: "false"
      DB_POOL_LIMIT: "${DB_POOL_LIMIT:-16}"
      REDIS_URL: redis://redis:6379
      # Client-visible asset links must not point back to the legacy Vercel
      # origin after the VPS becomes authoritative.
      NAZRAA_PUBLIC_API_ORIGIN: https://api.nazraa.pixtra.site
      # The production VPS never falls back to frozen ZEGO media.
      MEDIA_PROVIDER: LIVEKIT
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    image: nazraa-api:production-candidate
    profiles: [cutover]
    restart: unless-stopped
    command: ["node", "worker.mjs"]
    env_file: ./config/app.env
    depends_on:
      api: { condition: service_healthy }
    networks: [private]

  realtime:
    image: nazraa-api:production-candidate
    profiles: [edge]
    restart: unless-stopped
    command: ["node", "realtime.mjs"]
    env_file: ./config/app.env
    environment:
      REDIS_URL: redis://redis:6379
      REALTIME_API_ORIGIN: http://api:3000
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:3100:3100"
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    profiles: [edge]
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }
    networks: [private]

networks:
  private:
    internal: false
