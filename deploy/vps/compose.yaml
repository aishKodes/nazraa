name: nazraa

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ./config/mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+00:00
      - --slow-query-log=ON
      - --long-query-time=0.5
      - --innodb-buffer-pool-size=8G
      - --max-connections=150
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./app
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file: ./config/app.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ./config/caddy.env
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [private]

networks:
  private:
    internal: false
